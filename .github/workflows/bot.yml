name: Trading Bot

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode'
        required: false
        default: 'scan'
      backtest_days:
        description: 'Backtest days'
        required: false
        default: '180'
  schedule:
    # Crons are UTC and do NOT follow daylight saving. These windows are
    # widened to cover the 9:30-4:00 ET session in BOTH EDT (UTC-4) and
    # EST (UTC-5). The bot's own is_good_trading_time() gate (which runs on
    # ET) decides whether a given tick actually scans, so the off-session
    # extra runs exit in seconds and cost nothing.
    - cron: '*/5 12-21 * * 1-5'   # every 5 min, covers full session year-round
    - cron: '*/2 13-15 * * 1-5'   # open burst (9:30 EDT / 9:30 EST both covered)
    - cron: '*/2 18-21 * * 1-5'   # close burst + EOD close both timezones
    - cron: '0 0 * * *'           # nightly (daily review / backtest)
    - cron: '0 12 * * 0'          # Sunday (weekly research digest)

# Prevents two runs from executing simultaneously. Without this, the
# overlapping crons above (or a slow run + the next tick) could both see
# 0 open positions and both submit the same orders. cancel-in-progress is
# false so a run that's mid-order never gets killed; the newer run queues
# (GitHub keeps at most one queued per group).
concurrency:
  group: boticus-run
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: bot_state
          key: bot-state-${{ github.run_number }}
          restore-keys: bot-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:    ${{ secrets.ALPACA_BASE_URL }}
          FRED_API_KEY:       ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          PAPER_MODE:         ${{ secrets.PAPER_MODE }}
          ACCOUNT_EQUITY:     ${{ secrets.ACCOUNT_EQUITY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL:      ${{ secrets.DASHBOARD_URL }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          EOD_CLOSE:          'true'
          STATE_DIR:          bot_state
          RUN_MODE:           ${{ github.event.inputs.run_mode || 'scan' }}
          BACKTEST_DAYS:      ${{ github.event.inputs.backtest_days || '180' }}
        run: python -u bot.py

      - name: Save bot state
        uses: actions/cache@v4
        with:
          path: bot_state
          key: bot-state-${{ github.run_number }}

      # NOTE: the "Commit state to repo" git-push step is intentionally REMOVED.
      # bot.py already commits state files via the GitHub Contents API at the
      # end of each run (commit_state_to_github). Having both created a race:
      # the API commits moved the remote ahead, the git push here failed
      # non-fast-forward, and the `|| true` silently swallowed it. One writer.

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_number }}
          path: bot_state/bot.log
          retention-days: 7
