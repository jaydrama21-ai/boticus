name: Trading Bot

on:
  schedule:
    - cron: '*/10 13-21 * * 1-5'
    - cron: '30 20,21 * * 1-5'
    - cron: '0 12,13 * * 0'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: scan | review | status | backtest | auto_adjust | dashboard'
        required: false
        default: 'scan'
      backtest_days:
        description: 'Days of history for backtest (default 180)'
        required: false
        default: '180'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: bot_state/
          key: bot-state-${{ github.run_number }}
          restore-keys: |
            bot-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading bot
        env:
          ALPACA_API_KEY:      ${{ secrets.ALPACA_API_KEY }}
          ALPACA_
