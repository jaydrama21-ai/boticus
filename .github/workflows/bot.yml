name: Boticus Trading Bot

# ─────────────────────────────────────────────────────────────
# AGGRESSIVE SCHEDULE STRATEGY
#  Problem: GitHub silently skips ~50% of every-10-min crons
#  Fix: Saturate open & close windows with per-minute entries
#       so even if half are dropped we still get ~2-min coverage
#       at the critical moments. Mid-day uses every-5-min so
#       worst case is every-10-min there (acceptable).
#
#  All times in UTC.  ET summer = UTC-4.
# ─────────────────────────────────────────────────────────────

on:
  schedule:

    # ── PRE-MARKET SETUP ──────────────────────────────────────
    - cron: '0  13 * * 1-5'   # 9:00 AM ET  — pre-market setup
    - cron: '15 13 * * 1-5'   # 9:15 AM ET
    - cron: '25 13 * * 1-5'   # 9:25 AM ET  — 5 min to open

    # ── OPEN WINDOW (minute-by-minute 9:29–9:45 AM ET) ────────
    - cron: '29 13 * * 1-5'   # 9:29 AM ET  — 1 min before open
    - cron: '30 13 * * 1-5'   # 9:30 AM ET  — MARKET OPEN ★
    - cron: '31 13 * * 1-5'   # 9:31 AM ET
    - cron: '32 13 * * 1-5'   # 9:32 AM ET
    - cron: '33 13 * * 1-5'   # 9:33 AM ET
    - cron: '34 13 * * 1-5'   # 9:34 AM ET
    - cron: '35 13 * * 1-5'   # 9:35 AM ET
    - cron: '36 13 * * 1-5'   # 9:36 AM ET
    - cron: '37 13 * * 1-5'   # 9:37 AM ET
    - cron: '38 13 * * 1-5'   # 9:38 AM ET
    - cron: '39 13 * * 1-5'   # 9:39 AM ET
    - cron: '40 13 * * 1-5'   # 9:40 AM ET
    - cron: '41 13 * * 1-5'   # 9:41 AM ET
    - cron: '42 13 * * 1-5'   # 9:42 AM ET
    - cron: '43 13 * * 1-5'   # 9:43 AM ET
    - cron: '44 13 * * 1-5'   # 9:44 AM ET
    - cron: '45 13 * * 1-5'   # 9:45 AM ET

    # ── MID-DAY (every 5 min: 10:00 AM – 3:29 PM ET) ─────────
    # Worst case if GitHub drops 50%: one run every 10 min
    - cron: '*/5 14-18 * * 1-5'                    # 10:00 AM – 2:55 PM ET
    - cron: '0,5,10,15,20,25 19 * * 1-5'           # 3:00 PM – 3:25 PM ET

    # ── CLOSE WINDOW (minute-by-minute 3:30–4:05 PM ET) ──────
    - cron: '30 19 * * 1-5'   # 3:30 PM ET
    - cron: '31 19 * * 1-5'   # 3:31 PM ET
    - cron: '32 19 * * 1-5'   # 3:32 PM ET
    - cron: '33 19 * * 1-5'   # 3:33 PM ET
    - cron: '34 19 * * 1-5'   # 3:34 PM ET
    - cron: '35 19 * * 1-5'   # 3:35 PM ET
    - cron: '36 19 * * 1-5'   # 3:36 PM ET
    - cron: '37 19 * * 1-5'   # 3:37 PM ET
    - cron: '38 19 * * 1-5'   # 3:38 PM ET
    - cron: '39 19 * * 1-5'   # 3:39 PM ET
    - cron: '40 19 * * 1-5'   # 3:40 PM ET
    - cron: '41 19 * * 1-5'   # 3:41 PM ET
    - cron: '42 19 * * 1-5'   # 3:42 PM ET
    - cron: '43 19 * * 1-5'   # 3:43 PM ET
    - cron: '44 19 * * 1-5'   # 3:44 PM ET
    - cron: '45 19 * * 1-5'   # 3:45 PM ET
    - cron: '46 19 * * 1-5'   # 3:46 PM ET
    - cron: '47 19 * * 1-5'   # 3:47 PM ET
    - cron: '48 19 * * 1-5'   # 3:48 PM ET
    - cron: '49 19 * * 1-5'   # 3:49 PM ET
    - cron: '50 19 * * 1-5'   # 3:50 PM ET
    - cron: '51 19 * * 1-5'   # 3:51 PM ET
    - cron: '52 19 * * 1-5'   # 3:52 PM ET
    - cron: '53 19 * * 1-5'   # 3:53 PM ET
    - cron: '54 19 * * 1-5'   # 3:54 PM ET
    - cron: '55 19 * * 1-5'   # 3:55 PM ET
    - cron: '56 19 * * 1-5'   # 3:56 PM ET
    - cron: '57 19 * * 1-5'   # 3:57 PM ET
    - cron: '58 19 * * 1-5'   # 3:58 PM ET
    - cron: '59 19 * * 1-5'   # 3:59 PM ET
    - cron: '0  20 * * 1-5'   # 4:00 PM ET  — MARKET CLOSE ★
    - cron: '1  20 * * 1-5'   # 4:01 PM ET
    - cron: '2  20 * * 1-5'   # 4:02 PM ET
    - cron: '3  20 * * 1-5'   # 4:03 PM ET
    - cron: '4  20 * * 1-5'   # 4:04 PM ET
    - cron: '5  20 * * 1-5'   # 4:05 PM ET

    # ── POST-CLOSE REVIEW ─────────────────────────────────────
    - cron: '15 20 * * 1-5'   # 4:15 PM ET  — post-close digest
    - cron: '30 20 * * 1-5'   # 4:30 PM ET  — extended hours scan
    - cron: '0  21 * * 1-5'   # 5:00 PM ET  — final wrap

    # ── WEEKEND ───────────────────────────────────────────────
    - cron: '0  14 * * 0'     # Sunday 10:00 AM ET — backtest run
    - cron: '0  15 * * 0'     # Sunday 11:00 AM ET — research digest

    # ── KEEP-ALIVE (prevents GitHub disabling the schedule) ───
    # GitHub disables scheduled workflows after 60 days of repo inactivity.
    # This midnight ping keeps the workflow alive without interfering with trading.
    - cron: '0 0 * * *'       # midnight UTC daily keep-alive

  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - status
          - research
          - backtest
          - recent_regime
          - auto_adjust
          - review
          - dashboard
      backtest_days:
        description: 'Backtest lookback (days)'
        required: false
        default: '180'
        type: choice
        options:
          - '60'
          - '90'
          - '180'
          - '365'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: bot_state/
          key: bot-state-${{ github.run_number }}
          restore-keys: |
            bot-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ALPACA_API_KEY:      ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:   ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:     ${{ secrets.ALPACA_BASE_URL }}
          FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          PAPER_MODE:          ${{ secrets.PAPER_MODE }}
          ACCOUNT_EQUITY:      ${{ secrets.ACCOUNT_EQUITY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL:       ${{ secrets.DASHBOARD_URL }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
          EOD_CLOSE:           true
          STATE_DIR:           bot_state
          RUN_MODE:            ${{ github.event.inputs.mode || 'scan' }}
          BACKTEST_DAYS:       ${{ github.event.inputs.backtest_days || '180' }}
        run: python -u bot.py

      - name: Save bot state
        uses: actions/cache@v4
        if: always()
        with:
          path: bot_state/
          key: bot-state-${{ github.run_number }}

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-logs-${{ github.run_id }}
          path: |
            bot_state/bot.log
            bot_state/backtest_latest.json
            bot_state/auto_adjust_latest.json
            bot_state/research_digest.json
          retention-days: 14
