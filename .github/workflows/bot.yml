name: Trading Bot

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode'
        required: false
        default: 'scan'
      backtest_days:
        description: 'Backtest days'
        required: false
        default: '180'
  schedule:
    - cron: '*/5 13-20 * * 1-5'
    - cron: '*/2 13-14 * * 1-5'
    - cron: '*/2 19-20 * * 1-5'
    - cron: '0 0 * * *'
    - cron: '0 12 * * 0'

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: bot_state
          key: bot-state-${{ github.run_number }}
          restore-keys: bot-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:    ${{ secrets.ALPACA_BASE_URL }}
          FRED_API_KEY:       ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          PAPER_MODE:         ${{ secrets.PAPER_MODE }}
          ACCOUNT_EQUITY:     ${{ secrets.ACCOUNT_EQUITY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL:      ${{ secrets.DASHBOARD_URL }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          EOD_CLOSE:          'true'
          STATE_DIR:          bot_state
          RUN_MODE:           ${{ github.event.inputs.run_mode || 'scan' }}
          BACKTEST_DAYS:      ${{ github.event.inputs.backtest_days || '180' }}
        run: python -u bot.py

      - name: Save bot state
        uses: actions/cache@v4
        with:
          path: bot_state
          key: bot-state-${{ github.run_number }}

      - name: Commit state to repo
        run: |
          git config user.email "bot@boticus.app"
          git config user.name "Boticus"
          git add bot_state/ || true
          git diff --staged --quiet || git commit -m "bot: update state [skip ci]"
          git push || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_number }}
          path: bot_state/bot.log
          retention-days: 7
