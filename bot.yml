name: Trading Bot

on:
  schedule:
    # Every 10 min market hours Mon-Fri (covers EST and EDT)
    - cron: '*/10 13-21 * * 1-5'
    # Post-close review 4:30 PM ET
    - cron: '30 20,21 * * 1-5'
    # Sunday backtest + auto-adjust 8 AM ET
    - cron: '0 12,13 * * 0'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: scan | review | status | backtest | auto_adjust | dashboard'
        required: false
        default: 'scan'
      backtest_days:
        description: 'Days of history for backtest (default 180)'
        required: false
        default: '180'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: bot_state/
          key: bot-state-${{ github.run_number }}
          restore-keys: |
            bot-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading bot
        env:
          ALPACA_API_KEY:      ${{ secrets.PKI3FRZTU2BEBF7XPKFEIDXP56 }}
          ALPACA_SECRET_KEY:   ${{ secrets.He45Xrmqdzft84exS7xrt6Xqwm6WJRj1Rhwuz7HKNuDx }}
          ALPACA_BASE_URL:     ${{ secrets.https://paper-api.alpaca.markets }}
          FRED_API_KEY:        ${{ secrets.f2e0c562b2d0764cfa6b0bb215bb823b }}
          ANTHROPIC_API_KEY:   ${{ secrets.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 }}
          PAPER_MODE:          ${{ secrets.PAPER_MODE }}
          ACCOUNT_EQUITY:      ${{ secrets.1000000 }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.bot8425149242:AAEfe6HC9LD1PxD3ChnW-c6uKoRzlusv1Iw}}
          TELEGRAM_CHAT_ID:    ${{ secrets.1986511037 }}
          STATE_DIR:           bot_state
          RUN_MODE:            ${{ github.event.inputs.mode || 'scan' }}
          BACKTEST_DAYS:       ${{ github.event.inputs.backtest_days || '180' }}
        run: python bot.py

      - name: Save bot state
        uses: actions/cache@v4
        if: always()
        with:
          path: bot_state/
          key: bot-state-${{ github.run_number }}

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-logs-${{ github.run_id }}
          path: |
            bot_state/bot.log
            bot_state/backtest_latest.json
            bot_state/auto_adjust_latest.json
          retention-days: 14
